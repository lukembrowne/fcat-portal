services:
  portal:
    build: .
    ports:
      - "127.0.0.1:3003:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data                     # DB + thumbnails + allowed emails
      - ml-venv:/app/data/ml-venv            # Named volume — keeps venv off host filesystem
    environment:
      - NODE_ENV=production
      - DB_PATH=data/portal.db
      - ML_PYTHON_PATH=data/ml-venv/bin/python3
      - ML_VENV_DIR=data/ml-venv
      # Persist torch hub model weights across container restarts.
      # Set here (not just in docker-entrypoint.sh) so dev mode also gets it —
      # docker-compose.override.yml replaces the entrypoint with a custom command
      # that never sources docker-entrypoint.sh.
      - TORCH_HOME=/app/data/ml-cache/torch
      # Same, for the HuggingFace cache — a BioCLIP (v3) model downloads its
      # ~2.5 GB checkpoint here; without a persistent path it re-downloads every
      # restart (HOME is /tmp/ml-home, wiped each boot).
      - HF_HOME=/app/data/ml-cache/huggingface
      # Comma-separated super admins. Set it in .env (prod) or the dev override;
      # the fallback keeps the historical value so a server whose .env doesn't
      # define it behaves exactly as before rather than losing super admin access.
      - SUPER_ADMIN_EMAILS=${SUPER_ADMIN_EMAILS:-lukebrowne@fcat-ecuador.org}
      - ALLOWED_EMAILS_PATH=data/allowed_external_emails.txt
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NIGHTLY_REPORT_EMAILS=${NIGHTLY_REPORT_EMAILS:-}
      - PORTAL_UPDATES_EMAILS=${PORTAL_UPDATES_EMAILS:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-portal@fcat-ecuador.org}
      - CRON_SECRET=${CRON_SECRET:-}
      # IUCN Red List v4 token — only used by scripts/backfill-iucn-status.mjs.
      - IUCN_API_TOKEN=${IUCN_API_TOKEN:-}
      # Fixed landowner intro/thank-you video (Drive file id). Empty = hidden.
      - LANDOWNER_INTRO_VIDEO_DRIVE_FILE_ID=${LANDOWNER_INTRO_VIDEO_DRIVE_FILE_ID:-}
      # Landowner contact-form recipients (csv). Empty = biochoco editors/admins.
      - BIOCHOCO_CONTACT_EMAILS=${BIOCHOCO_CONTACT_EMAILS:-}
      # DB backup offload to a DigitalOcean Space (S3-compatible). Default OFF —
      # the backup script runs gzip-local-only until the Space + creds exist and
      # BACKUP_OFFLOAD_ENABLED=true. Passed into the container so the entrypoint
      # can forward them to /etc/cron.d/portal-env for the hourly backup cron.
      - BACKUP_OFFLOAD_ENABLED=${BACKUP_OFFLOAD_ENABLED:-false}
      - SPACES_ENDPOINT=${SPACES_ENDPOINT:-}
      - SPACES_REGION=${SPACES_REGION:-}
      - SPACES_BUCKET=${SPACES_BUCKET:-}
      - SPACES_KEY=${SPACES_KEY:-}
      - SPACES_SECRET=${SPACES_SECRET:-}
      # Free-disk alert thresholds (GB) for /api/cron/disk-maintenance; unset → code defaults.
      - DISK_WARN_FREE_GB=${DISK_WARN_FREE_GB:-}
      - DISK_CRITICAL_FREE_GB=${DISK_CRITICAL_FREE_GB:-}
      - DISK_ALERT_EMAILS=${DISK_ALERT_EMAILS:-}
      - TZ=America/New_York
      - FLAC_COMPRESSION_BATCH_SIZE=20
      - FLAC_COMPRESSION_WORKERS=8
      # Occupancy fitting: warm pool of persistent R workers (each loads unmarked
      # once, fits many models). OCCUPANCY_WORKERS = pool size (flat 4 to leave
      # cores for co-tenants on the shared droplet; capped at core count).
      # OCCUPANCY_WARM_POOL=false reverts to the legacy spawn-one-Rscript-per-model
      # path — an emergency lever if the pool misbehaves on the nightly cron.
      - OCCUPANCY_WORKERS=${OCCUPANCY_WORKERS:-4}
      - OCCUPANCY_WARM_POOL=${OCCUPANCY_WARM_POOL:-true}
      # Multi-Shared-Drive fan-out flags (SHARED_DRIVE_DISCOVERY_ENABLED,
      # SHARED_DRIVE_ROUTING_ENABLED) are NOT pinned here so they can be set like
      # every other option: .env.local in dev, server .env in prod. Both default
      # OFF — the code (sharedDriveDiscoveryEnabled / sharedDriveRoutingEnabled)
      # treats an unset value as false. Flip discovery first.
    restart: unless-stopped
    # RAM cap so a heavy ML job (BioCLIP ViT-H peaks ~8 GB resident) can't grow
    # into the co-tenant containers (ODK Central + its postgres, ChocoForestWatch,
    # etc.) on this shared 15.6 GB host and trigger a HOST-wide OOM kill — the
    # failure mode behind the 2026-05-25 Central outage. With a limit the cgroup
    # OOM killer kills a process INSIDE this container instead, isolating the
    # blast radius. ~11 GB leaves ~3 GB headroom over the observed BioCLIP peak
    # while keeping the host's other ~24 containers safe. memswap_limit ==
    # mem_limit disables swap for this container: host swap is chronically full,
    # and an ML job that swaps is useless — fail fast instead of thrashing.
    mem_limit: 11g
    memswap_limit: 11g
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    ports:
      - "127.0.0.1:4181:4180"
    environment:
      - OAUTH2_PROXY_PROVIDER=google
      # Empty defaults so a developer running `docker compose` WITHOUT a .env
      # doesn't get "variable is not set" warnings on every single command.
      # (In dev this service never starts anyway — the override file puts it
      # behind a `production` profile.) Production supplies all three via
      # /root/opt/fcat-portal/.env; behavior there is unchanged, since an unset
      # variable already interpolated to a blank string.
      - OAUTH2_PROXY_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - OAUTH2_PROXY_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - OAUTH2_PROXY_COOKIE_SECRET=${PORTAL_OAUTH_COOKIE_SECRET:-}
      - OAUTH2_PROXY_COOKIE_DOMAIN=portal.fcat-ecuador.org
      - OAUTH2_PROXY_COOKIE_NAME=_fcat_portal_oauth2
      - OAUTH2_PROXY_EMAIL_DOMAINS=fcat-ecuador.org
      - OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE=/data/allowed_external_emails.txt
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_REDIRECT_URL=https://portal.fcat-ecuador.org/oauth2/callback
      - OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR=/templates
    volumes:
      - ./data:/data:ro
      - ./oauth2-proxy-templates:/templates:ro
    restart: unless-stopped

volumes:
  ml-venv:
