services:
  portal:
    build: .
    ports:
      - "127.0.0.1:3003:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data                     # DB + thumbnails + allowed emails + ML venv
      - ${GDRIVE_PATH:-./data/gdrive}:/mnt/gdrive:ro    # rclone mount (prod: /mnt/gdrive)
    environment:
      - NODE_ENV=production
      - DB_PATH=data/portal.db
      - ML_PYTHON_PATH=data/ml-venv/bin/python3
      - ML_VENV_DIR=data/ml-venv
      - SUPER_ADMIN_EMAILS=lukebrowne@fcat-ecuador.org
      - ALLOWED_EMAILS_PATH=data/allowed_external_emails.txt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    ports:
      - "127.0.0.1:4181:4180"
    environment:
      - OAUTH2_PROXY_PROVIDER=google
      - OAUTH2_PROXY_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${PORTAL_OAUTH_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_DOMAIN=portal.fcat-ecuador.org
      - OAUTH2_PROXY_COOKIE_NAME=_fcat_portal_oauth2
      - OAUTH2_PROXY_EMAIL_DOMAINS=fcat-ecuador.org
      - OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE=/data/allowed_external_emails.txt
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_REDIRECT_URL=https://portal.fcat-ecuador.org/oauth2/callback
      - OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR=/templates
    volumes:
      - ./data:/data:ro
      - ./oauth2-proxy-templates:/templates:ro
    restart: unless-stopped
